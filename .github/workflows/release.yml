name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish Charts to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git author
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.1

      - name: Register chart dependency repositories
        run: |
          python3 - <<'PY'
          import glob, subprocess, yaml
          repos = set()
          for path in glob.glob("charts/*/Chart.yaml"):
              with open(path, "r", encoding="utf-8") as fh:
                  chart = yaml.safe_load(fh) or {}
              for dep in chart.get("dependencies") or []:
                  repo = (dep.get("repository") or "").strip()
                  if repo.startswith(("http://", "https://")):
                      repos.add(repo)
          for idx, url in enumerate(sorted(repos)):
              subprocess.run(["helm", "repo", "add", f"dep-{idx}", url], check=True)
          if repos:
              subprocess.run(["helm", "repo", "update"], check=True)
          PY

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: charts
          pages_branch: gh-pages
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
