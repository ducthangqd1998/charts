apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "9router.fullname" . }}-test-connection"
  labels:
    {{- include "9router.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37.0
      command:
        - wget
      args:
        - --spider
        - -q
        - "http://{{ include "9router.fullname" . }}:{{ .Values.service.port }}/api/health"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
