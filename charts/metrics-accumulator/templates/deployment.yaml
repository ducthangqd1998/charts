{{- $hasConfig := include "metrics-accumulator.hasConfig" . -}}
{{- $selectorLabels := include "metrics-accumulator.selectorLabels" . | fromYaml -}}
{{- $podLabels := mergeOverwrite (dict) $selectorLabels (.Values.podLabels | default dict) -}}
{{- $podAnnotations := dict -}}
{{- if $hasConfig }}
{{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) -}}
{{- end }}
{{- $podAnnotations = mergeOverwrite $podAnnotations (.Values.podAnnotations | default dict) -}}
{{- $envList := concat (.Values.env | default list) (.Values.extraEnv | default list) -}}
{{- $args := list -}}
{{- if $hasConfig }}
{{- $hasCustomConfigArg := false -}}
{{- range (.Values.extraArgs | default list) }}
{{- if hasPrefix "--config-file" (toString .) }}
{{- $hasCustomConfigArg = true -}}
{{- end }}
{{- end }}
{{- if not $hasCustomConfigArg }}
{{- $args = append $args "--config-file=/etc/metrics-accumulator/metrics-accumulator.yml" -}}
{{- end }}
{{- end }}
{{- if .Values.extraArgs }}
{{- $args = concat $args .Values.extraArgs -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-accumulator.fullname" . }}
  labels:
    {{- include "metrics-accumulator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- toYaml $selectorLabels | nindent 6 }}
  template:
    metadata:
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "metrics-accumulator.serviceAccountName" . }}
      {{- if hasKey .Values.serviceAccount "automount" }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "metrics-accumulator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $args }}
          args:
            {{- toYaml $args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if $envList }}
          env:
            {{- toYaml $envList | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $hasConfig }}
            - name: config
              mountPath: /etc/metrics-accumulator/metrics-accumulator.yml
              subPath: metrics-accumulator.yml
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: storage
              mountPath: {{ .Values.persistence.mountPath | default "/data" }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $hasConfig }}
        - name: config
          configMap:
            name: {{ include "metrics-accumulator.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "metrics-accumulator.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
