{{- if .Values.networkPolicy.enabled }}
{{- $policyTypes := .Values.networkPolicy.policyTypes | default (list "Ingress" "Egress") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metrics-accumulator.fullname" . }}
  labels:
    {{- include "metrics-accumulator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metrics-accumulator.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else if has "Ingress" $policyTypes }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else if has "Egress" $policyTypes }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  {{- end }}
{{- end }}
