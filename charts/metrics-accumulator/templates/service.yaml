{{- $baseLabels := include "metrics-accumulator.labels" . | fromYaml -}}
{{- $labels := mergeOverwrite (dict) $baseLabels (.Values.service.labels | default dict) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metrics-accumulator.fullname" . }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "metrics-accumulator.selectorLabels" . | nindent 4 }}
