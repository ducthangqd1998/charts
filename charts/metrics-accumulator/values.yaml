# Default values for metrics-accumulator.
# This is a YAML-formatted file.

replicaCount: 1

image:
  # Image repository (default bpoole6/metrics-accumulator) or your custom image
  repository: bpoole6/metrics-accumulator
  # Overrides the image tag whose default is the chart appVersion ("2.0.1")
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Disable ServiceAccount API token automount by default
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Pod Security Standards (Restricted profile)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: metrics-accumulator.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Persistence for metrics storage.
# Note: ReadWriteOnce PVCs can only attach to a single node/replica unless using ReadWriteMany.
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  mountPath: /data

# Environment variables
env: []
extraEnv: []
extraEnvFrom: []

# Probes target the named container port `http` (service.targetPort) on the
# upstream unauthenticated Prometheus HTTP SD endpoint `/service-discovery`.
startupProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10

terminationGracePeriodSeconds: 60

# ServiceMonitor configuration for Prometheus Operator
serviceMonitor:
  enabled: false
  namespace: ""
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics/default"
  honorLabels: true
  labels: {}
  annotations: {}

# NetworkPolicy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Extra CLI arguments and containers
extraArgs: []
initContainers: []
extraContainers: []

# Configuration file for metrics-accumulator (raw YAML content).
# If non-empty, a ConfigMap is created, mounted at
# /etc/metrics-accumulator/metrics-accumulator.yml, and passed to the container via:
#   --config-file=/etc/metrics-accumulator/metrics-accumulator.yml
#
# SECURITY WARNING:
# NEVER commit plaintext `apiKey` values into `values.yaml` or Git!
# For production secrets, mount a Secret managed by External Secrets Operator / Vault
# via `volumes` + `volumeMounts` and pass `--config-file=...` in `extraArgs`, or inject
# sensitive environment variables via `extraEnv` / `extraEnvFrom`.
#
# Example structure (DO NOT hardcode real API keys in Git):
# config: |
#   global:
#     restartCronExpression: "0 0 0 ? * *"
#     hostAddress: metrics-accumulator:8080
#   metricGroups:
#     default:
#       displayMetrics: true
#       name: default
#       maxTimeSeries: 2500
#       apiKey: "<inject-via-secret-not-git>"
#       serviceDiscoveryLabels:
#         env: dev
config: ""
