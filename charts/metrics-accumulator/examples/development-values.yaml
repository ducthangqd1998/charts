# Development values for metrics-accumulator
# Lightweight local development configuration (Minikube, Kind, K3s).

replicaCount: 1

image:
  repository: bpoole6/metrics-accumulator
  tag: "2.0.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

persistence:
  enabled: false

service:
  type: NodePort
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: metrics-accumulator.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: true
  interval: "15s"
  scrapeTimeout: "5s"
  path: "/metrics/default"
  honorLabels: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: LOG_LEVEL
    value: "DEBUG"

networkPolicy:
  enabled: false
