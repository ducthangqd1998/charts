# Production values for metrics-accumulator
# High-availability, Pod Security Standards (Restricted), ServiceMonitor, and NetworkPolicy.

replicaCount: 3

image:
  repository: bpoole6/metrics-accumulator
  tag: "2.0.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Persistence is disabled in multi-replica HA mode because ReadWriteOnce PVCs
# cannot be mounted across multiple nodes simultaneously (Multi-Attach error).
# If single-instance persistence is required, set replicaCount: 1, autoscaling.enabled: false,
# or use a ReadWriteMany StorageClass.
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: "fast-ssd"
  mountPath: /data

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: metrics-accumulator.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: metrics-accumulator-tls
      hosts:
        - metrics-accumulator.example.com

serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics/default"
  honorLabels: true
  labels:
    prometheus: kube-prometheus

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /service-discovery
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: LOG_LEVEL
    value: "INFO"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - metrics-accumulator
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "monitoring"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
