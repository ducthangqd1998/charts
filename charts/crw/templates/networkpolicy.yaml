{{- if .Values.networkPolicy.enabled }}
{{- $policyTypes := .Values.networkPolicy.policyTypes | default (list "Ingress" "Egress") -}}
{{- $containerPort := .Values.service.targetPort | default 3000 -}}
{{- $searxng := index .Values "searxng" | default dict -}}
{{- $searxngSvc := $searxng.service | default dict -}}
{{- $searxngPort := default 8080 $searxngSvc.port -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crw.fullname" . }}
  labels:
    {{- include "crw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crw.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else if has "Ingress" $policyTypes }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ $containerPort }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else if has "Egress" $policyTypes }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- if .Values.search.enabled }}
    - ports:
        - protocol: TCP
          port: {{ $searxngPort }}
    {{- end }}
  {{- end }}
{{- end }}
