# Default values for crw.
# High-performance web scraping, crawling, and AI search API (Tavily/Firecrawl alternative).

replicaCount: 1

image:
  repository: ghcr.io/fastcrw/crw
  tag: "0.42.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  annotations: {}

# Web search configuration
search:
  enabled: true
  # URL of the search backend (e.g. http://searxng.default.svc.cluster.local:8080)
  # If left empty and searxng.enabled is true, automatically connects to the companion SearXNG subchart!
  backendUrl: ""

# SearXNG Dependency (Subchart from https://techpipe-io.github.io/searxng-helm-chart/)
# Enabled by default to provide an out-of-the-box local search backend.
# Set to false if you already run an external SearXNG cluster or only need web scraping / crawling.
searxng:
  enabled: true
  config:
    useDefaultSettings: true
    settings:
      search:
        formats:
          - html
          - json
  valkey:
    enabled: false # Set true if you want distributed caching/rate-limiting via Valkey

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

terminationGracePeriodSeconds: 30

env: {}
extraEnv: []
extraEnvFrom: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Standard Kubernetes Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: crw.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Kubernetes Gateway API HTTPRoute configuration
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules: []

# PodDisruptionBudget for high availability
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# NetworkPolicy configuration
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
