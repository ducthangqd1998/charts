# Default values for crw.
# High-performance web scraping, crawling, and AI search API (Tavily/Firecrawl alternative).

replicaCount: 1

image:
  repository: ghcr.io/fastcrw/crw
  tag: "0.42.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

# Web search configuration
search:
  enabled: true
  # URL of the search backend (e.g. http://searxng.default.svc.cluster.local:8080)
  # If left empty and searxng.enabled is true, automatically connects to the companion SearXNG subchart!
  backendUrl: ""

# SearXNG Dependency (Subchart from https://techpipe-io.github.io/searxng-helm-chart/)
# Enabled by default to provide an out-of-the-box local search backend (requires Kubernetes >= 1.27).
# Set to false if you already run an external SearXNG cluster or only need web scraping / crawling.
searxng:
  enabled: true
  secret:
    create: true
    # GitOps / Argo CD users: set create: false and reference a pre-existing Secret
    # containing key SEARXNG_SECRET to avoid Helm lookup / randAlphaNum sync drift.
    existingSecret: ""
    existingSecretKey: SEARXNG_SECRET
  config:
    useDefaultSettings: true
    settings:
      search:
        formats:
          - html
          - json
  persistence:
    cache:
      # Disabled by default to use emptyDir, avoiding Pending PVCs on clusters without a
      # default StorageClass and ReadWriteOnce Multi-Attach errors when scaling SearXNG.
      enabled: false
  valkey:
    enabled: false # Set true if you want distributed caching/rate-limiting via Valkey

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10

terminationGracePeriodSeconds: 60

env: {}
extraEnv: []
extraEnvFrom: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# HorizontalPodAutoscaler (autoscaling/v2) configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Standard Kubernetes Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: crw.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Kubernetes Gateway API HTTPRoute configuration
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules: []

# PodDisruptionBudget for high availability
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# NetworkPolicy configuration
# When enabled with empty ingress/egress lists, sensible defaults are rendered:
# - Ingress allowed on container port (service.targetPort)
# - Egress allowed for DNS (UDP/TCP 53), HTTP/HTTPS scraping (80/443), and SearXNG (8080)
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
