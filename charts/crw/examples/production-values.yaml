# Production values for crw
# High availability, bundled SearXNG subchart, Ingress with TLS, and PDB.

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - crw
          topologyKey: kubernetes.io/hostname

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: crw.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: crw-tls
      hosts:
        - crw.example.com

# SearXNG Subchart Dependency configuration
searxng:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
