# Gateway API values for crw
# Standard Kubernetes Gateway API (gateway.networking.k8s.io/v1) HTTPRoute configuration.

search:
  enabled: true
  backendUrl: "http://searxng.default.svc.cluster.local:8080"

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "crw.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
