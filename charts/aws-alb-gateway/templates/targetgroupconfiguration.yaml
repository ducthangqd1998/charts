{{- $global := .Values.global | default dict -}}
{{- range $key, $gateway := .Values.gateways }}
{{- $defaultTargetGroup := $gateway.defaultTargetGroup | default dict }}
{{- if and $gateway.enabled (eq $gateway.mode "dedicated") $defaultTargetGroup.enabled }}
{{- $baseLabels := include "aws-alb-gateway.baseLabels" $ | fromYaml }}
{{- $componentLabels := dict "app.kubernetes.io/component" "default-target-group-configuration" "aws-alb-gateway.io/gateway-key" (toString $key) }}
{{- $labels := mergeOverwrite (dict) ($global.labels | default dict) $baseLabels $componentLabels ($defaultTargetGroup.labels | default dict) }}
{{- $annotations := mergeOverwrite (dict) ($global.annotations | default dict) ($defaultTargetGroup.annotations | default dict) }}
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "aws-alb-gateway.defaultTgConfigName" (dict "key" $key "gateway" $gateway) }}
  namespace: {{ required (printf "gateways.%s.namespace is required" $key) $gateway.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  defaultConfiguration:
    {{- include "aws-alb-gateway.targetGroupProps" (dict "root" $ "config" $defaultTargetGroup) | nindent 4 }}
{{- end }}
{{- end }}

{{- range $key, $route := .Values.routes }}
{{- $targetGroup := $route.targetGroup | default dict }}
{{- if and $route.enabled $targetGroup.enabled }}
{{- $defaultBackend := dict }}
{{- range $rule := $route.rules }}
{{- if and (empty $defaultBackend) $rule.backendRefs }}
{{- $defaultBackend = first $rule.backendRefs }}
{{- end }}
{{- end }}
{{- $targetReference := $targetGroup.targetReference | default dict }}
{{- $targetName := default $defaultBackend.name $targetReference.name }}
{{- $targetNamespace := default $route.namespace (default $defaultBackend.namespace $targetReference.namespace) }}
{{- $baseLabels := include "aws-alb-gateway.baseLabels" $ | fromYaml }}
{{- $componentLabels := dict "app.kubernetes.io/component" "service-target-group-configuration" "aws-alb-gateway.io/route-key" (toString $key) }}
{{- $labels := mergeOverwrite (dict) ($global.labels | default dict) $baseLabels $componentLabels ($targetGroup.labels | default dict) }}
{{- $annotations := mergeOverwrite (dict) ($global.annotations | default dict) ($targetGroup.annotations | default dict) }}
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "aws-alb-gateway.routeTgConfigName" (dict "key" $key "route" $route) }}
  namespace: {{ required (printf "routes.%s.namespace is required" $key) $targetNamespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  targetReference:
    {{- with $targetReference.group }}
    group: {{ . | quote }}
    {{- end }}
    kind: {{ default "Service" $targetReference.kind | quote }}
    name: {{ required (printf "routes.%s.targetGroup.targetReference.name or a rule with backendRefs[].name is required" $key) $targetName | quote }}
  defaultConfiguration:
    {{- include "aws-alb-gateway.targetGroupProps" (dict "root" $ "config" $targetGroup) | nindent 4 }}
{{- end }}
{{- end }}
